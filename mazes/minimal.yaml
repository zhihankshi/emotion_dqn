# Minimal 5x5 maze for initial testing
name: "minimal"
description: "5x5 minimal maze - simplest causal test"

# Grid dimensions [rows, cols]
size: [5, 5]

# Positions [row, col] - 0-indexed
agent_start: [0, 0]
key_position: [0, 4]
door_position: [3, 2]
goal_position: [4, 2]

# Wall barrier that forces agent through door
walls:
  - [3, 0]
  - [3, 1]
  - [3, 3]
  - [3, 4]

traps: []

# Reward structure
rewards:
  step: -0.04
  key: 1.0
  door_open: 2.0
  goal: 10.0
  trap: -5.0
  wall_bump: -0.1
  door_without_key: -0.5

# Episode settings
max_steps: 200

# Visual settings (RGB values)
colors:
  agent: [0, 0, 255]
  key: [255, 215, 0]
  door_locked: [139, 69, 19]
  door_open: [144, 238, 144]
  goal: [0, 255, 0]
  wall: [64, 64, 64]
  trap: [255, 0, 0]
  floor: [240, 240, 240]